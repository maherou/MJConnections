<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wedding Connections</title>
  <meta property="og:title" content="Wedding Connections" />
  <meta property="og:description" content="A Connections-style puzzle from M & J." />
  <meta property="og:image" content="https://maherou.github.io/MJConnections/images/og-image.png" />
  <meta property="og:url" content="https://maherou.github.io/MJConnections/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%92%8D</text></svg>" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="page-bg" class="page-bg" aria-hidden="true"></div>
  <main class="app">
    <section class="hero">
      <h1 id="puzzle-title">Loading puzzle…</h1>
      <p id="puzzle-subtitle" class="subtitle">Find four groups of four related words.</p>
    </section>

    <section id="puzzle-list" class="card hidden">
      <h2>Choose a puzzle</h2>
      <div id="puzzle-links" class="puzzle-links"></div>
    </section>

    <section id="game" class="game hidden" aria-live="polite">
      <div id="solved-groups" class="solved-groups"></div>
      <div id="grid" class="grid" aria-label="Puzzle words"></div>

      <div class="status-row">
        <div id="mistakes" class="mistakes">Mistakes remaining: ● ● ● ●</div>
        <div id="message" class="message"></div>
      </div>

      <div class="controls">
        <a class="button-link secondary" href="index.html">Back</a>
        <button id="shuffle-btn" type="button">Shuffle</button>
        <button id="clear-btn" type="button">Clear</button>
        <button id="submit-btn" type="button" disabled>Submit</button>
      </div>
    </section>

    <section id="end-screen" class="card hidden">
      <h2 id="end-title"></h2>
      <p id="end-message"></p>
      <div id="end-groups" class="solved-groups"></div>
      <button id="play-again-btn" type="button">Play again</button>
      <a class="button-link" href="index.html">Pick another puzzle</a>
    </section>

    <div id="details-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="details-text">
        <p id="details-text"></p>
        <button id="details-close-btn" type="button">Got it</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
